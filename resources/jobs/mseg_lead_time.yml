# SAP MSEG lead-time Job (env-parameterized)

resources:
  jobs:
    mseg_lead_time_agent:
      name: "[${bundle.target}] MSEG-Lead-Time-E2E-D2D"
      max_concurrent_runs: 1
      tags:
        project: mseg-lead-time
        env: ${bundle.target}

      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./gsk-pharma-lead-time/databricks/notebooks/01_ingest_mseg_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema_mseg}
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./gsk-pharma-lead-time/databricks/notebooks/02_transform_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema_mseg}
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}

        - task_key: gold_kpis
          depends_on:
            - task_key: transform_silver
          notebook_task:
            notebook_path: ./gsk-pharma-lead-time/databricks/notebooks/03_lead_time_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema_mseg}
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}

        - task_key: quality_checks
          depends_on:
            - task_key: gold_kpis
          notebook_task:
            notebook_path: ./gsk-pharma-lead-time/databricks/notebooks/04_quality_checks.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema_mseg}
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}

        - task_key: llm_agent
          depends_on:
            - task_key: quality_checks
          notebook_task:
            notebook_path: ./gsk-pharma-lead-time/databricks/notebooks/05_llm_agent.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema_mseg}
              secret_scope: ${var.openai_secret_scope}
              secret_key: ${var.openai_secret_key}
              openai_model: ${var.openai_model}
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}
